<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政大徵才月開幕互動 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: big-screen stage on top (or left), audience phone panel below (or right); one prismatic light world */
  color-scheme: light;
  --paper:#eef2f7;
  --ink:#1c2740;
  --ink-soft:#5a6682;
  --coral:#ff7a59;
  --amber:#ffb84d;
  --aqua:#5cc8f0;
  --indigo:#5b7be8;
  --violet:#b58cf0;
  --glass:rgba(255,255,255,.62);
  --font-display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-latin:"Montserrat","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-display);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}

/* ---------- control bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 16px;background:#fff;border-bottom:1px solid #dfe5ee}
.steps{display:flex;gap:6px;flex:1 1 auto;min-width:0}
.step{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#eef1f6;color:var(--ink-soft);white-space:nowrap}
.step b{font-family:var(--font-latin);margin-right:4px}
body[data-phase="1"] .step:nth-child(1),
body[data-phase="2"] .step:nth-child(2),
body[data-phase="3"] .step:nth-child(3){background:var(--ink);color:#fff}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.ctrl button{font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;background:#eef1f6}
.ctrl button[aria-pressed="true"]{background:var(--indigo);color:#fff}
.ctrl button:active{transform:scale(.96)}
.prog{height:3px;background:#dfe5ee}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--coral),var(--amber),var(--aqua),var(--indigo))}

/* ---------- stage ---------- */
.wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1 1 0;min-height:0;overflow:hidden;container-type:size;background:#fbfcff}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.halftone{position:absolute;inset:0;pointer-events:none;opacity:.6;
  background-image:radial-gradient(rgba(255,255,255,.75) 1px,transparent 1.6px);background-size:7px 7px;
  -webkit-mask-image:linear-gradient(115deg,transparent 10%,#000 45%,transparent 80%);mask-image:linear-gradient(115deg,transparent 10%,#000 45%,transparent 80%)}
.float{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.em{position:absolute;bottom:-6%;left:var(--x);font-size:clamp(18px,6cqmin,52px);animation:rise var(--d) ease-out forwards;will-change:transform,opacity}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}12%{opacity:1;transform:translate(0,-10cqh) scale(1.15)}100%{transform:translate(var(--dx),-98cqh) scale(1);opacity:0}}
.dm{position:absolute;left:0;top:var(--y);white-space:nowrap;font-weight:700;font-size:clamp(12px,3.4cqmin,30px);padding:.35em .9em;border-radius:99px;background:var(--glass);border:1px solid rgba(255,255,255,.9);color:var(--ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fly var(--d) linear forwards;will-change:transform}
.dm.me{background:var(--ink);color:#fff;border-color:transparent}
@keyframes fly{from{transform:translateX(100cqw)}to{transform:translateX(-110%)}}

.tag{position:absolute;top:2.5cqmin;left:2.5cqmin;font-family:var(--font-latin);font-size:clamp(9px,1.7cqmin,14px);font-weight:700;letter-spacing:.08em;padding:.4em .8em;border-radius:6px;background:rgba(28,39,64,.72);color:#fff;z-index:5}
.host{position:absolute;left:50%;bottom:2.5cqmin;transform:translateX(-50%);max-width:92%;font-size:clamp(11px,2.3cqmin,22px);font-weight:500;padding:.5em 1em;border-radius:12px;background:rgba(28,39,64,.78);color:#fff;text-align:center;z-index:5;text-wrap:balance}
.host b{color:var(--amber);margin-right:.5em;font-weight:700}

.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .5s,visibility .5s;padding:8cqmin 5cqw 12cqmin}
body[data-phase="1"] .s1,body[data-phase="2"] .s2,body[data-phase="3"] .s3{opacity:1;visibility:visible}

/* scene 1 */
.s1{gap:5cqw;padding-top:26cqh}
.qr{flex:0 0 auto;width:min(46cqh,32cqw);aspect-ratio:1;padding:3.5%;background:#fff;border-radius:6%;box-shadow:0 2cqmin 6cqmin rgba(60,80,140,.28);position:relative}
.qr svg{width:100%;height:100%;display:block}
.qr span{position:absolute;left:0;right:0;bottom:-2.2em;text-align:center;font-size:clamp(9px,1.8cqmin,15px);font-weight:700;color:var(--ink);opacity:.75}
.join{display:flex;flex-direction:column;gap:1.6cqmin;min-width:0}
.eyebrow{display:flex;align-items:center;gap:.6em;font-size:clamp(11px,2.4cqmin,24px);font-weight:700;color:#fff;text-shadow:0 1px 8px rgba(40,60,120,.55)}
.eyebrow::before{content:"";width:.7em;height:.7em;background:#fff}
.eyebrow::after{content:"";width:3em;height:.28em;background:#fff}
.join h1{font-size:clamp(20px,6.6cqmin,76px);font-weight:900;line-height:1.12;color:#fff;text-shadow:0 2px 14px rgba(40,60,120,.6);text-wrap:balance}
.count{display:inline-flex;align-items:baseline;gap:.5em;align-self:flex-start;padding:.45em .9em;border-radius:14px;background:var(--glass);border:1px solid rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:clamp(11px,2.4cqmin,22px);font-weight:700}
.count strong{font-family:var(--font-latin);font-weight:800;font-size:2.4em;line-height:1;font-variant-numeric:tabular-nums}
.live{width:.6em;height:.6em;border-radius:50%;background:#22c55e;align-self:center;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.3}}

/* scene 2 */
.s2{flex-direction:column;gap:3.5cqmin}
.q{font-size:clamp(15px,4.4cqmin,48px);font-weight:900;color:#fff;text-shadow:0 2px 14px rgba(40,60,120,.6);text-align:center}
.ring{position:relative;width:min(40cqh,34cqw);aspect-ratio:1;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 1cqmin 3cqmin rgba(60,80,140,.3))}
.ring .in{position:absolute;inset:11%;border-radius:50%;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2em}
.ring small{font-size:clamp(9px,1.9cqmin,18px);font-weight:700;color:var(--ink-soft)}
.ring strong{font-family:var(--font-latin);font-weight:800;font-size:clamp(24px,9cqmin,96px);line-height:1;font-variant-numeric:tabular-nums}
.ring em{font-style:normal;font-size:clamp(8px,1.6cqmin,15px);font-weight:700;color:#fff;background:var(--coral);padding:.2em .7em;border-radius:99px;visibility:hidden}
.ring em.on{visibility:visible}
.tug{width:min(100%,1100px);display:flex;flex-direction:column;gap:1.2cqmin}
.tug .lab{display:flex;justify-content:space-between;font-size:clamp(11px,2.6cqmin,26px);font-weight:900;color:#fff;text-shadow:0 1px 8px rgba(40,60,120,.6)}
.tug .lab span b{font-family:var(--font-latin);font-variant-numeric:tabular-nums;margin:0 .4em}
.track{height:clamp(14px,4.4cqmin,44px);border-radius:99px;overflow:hidden;display:flex;background:#fff;border:2px solid #fff;box-shadow:0 1cqmin 3cqmin rgba(60,80,140,.25)}
.track i{display:block;height:100%}
.track .a{background:linear-gradient(90deg,var(--coral),var(--amber));width:50%}
.track .b{background:linear-gradient(90deg,var(--aqua),var(--indigo),var(--violet));flex:1}

/* scene 3 */
.cd{position:absolute;font-family:var(--font-latin);font-weight:800;font-size:38cqmin;color:#fff;text-shadow:0 .5cqmin 4cqmin rgba(40,60,120,.55)}
.cd.pop{animation:pop .55s ease-out}
@keyframes pop{0%{transform:scale(1.6);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.85}}
.lit .cd{display:none}
.logo{display:none;flex-direction:column;align-items:flex-start;gap:1.4cqmin;color:#fff}
.lit .logo{display:flex}
.logo .yr{display:flex;align-items:center;gap:.5em;font-family:var(--font-latin);font-weight:700;font-size:clamp(14px,5cqmin,58px);text-shadow:0 2px 10px rgba(40,60,120,.5)}
.logo .yr::before{content:"";width:.34em;height:.34em;background:#fff}
.logo .yr::after{content:"";width:2.4em;height:.2em;background:#fff;transform-origin:left;animation:bar .7s .5s both cubic-bezier(.2,.8,.2,1)}
.logo .ttl{position:relative;font-weight:900;font-size:clamp(34px,15cqmin,190px);line-height:1.02;letter-spacing:.02em;text-shadow:-.018em 0 rgba(70,200,255,.75),.018em 0 rgba(255,110,160,.75),0 .4cqmin 2.2cqmin rgba(40,50,130,.5)}
.logo .ttl span{display:inline-block;animation:ch .9s both cubic-bezier(.2,.9,.2,1);animation-delay:calc(.12s*var(--i))}
@keyframes ch{0%{opacity:0;transform:translateY(.5em) scale(1.25);filter:blur(12px)}100%{opacity:1;transform:none;filter:blur(0)}}
.logo .en{display:flex;align-items:center;gap:.7em;font-family:var(--font-latin);font-weight:700;font-size:clamp(10px,3.3cqmin,38px);letter-spacing:.12em;text-shadow:0 2px 10px rgba(40,60,120,.5);animation:fade .8s .9s both}
.logo .en::before{content:"";width:.6em;height:.6em;background:#fff}
.logo .en::after{content:"";width:5em;height:.5em;background:rgba(255,255,255,.85);transform-origin:left;animation:bar .8s 1.1s both cubic-bezier(.2,.8,.2,1)}
.logo .slo{align-self:flex-end;font-weight:700;font-size:clamp(13px,4.6cqmin,54px);letter-spacing:.14em;margin-top:1cqmin;text-shadow:0 2px 12px rgba(40,60,120,.6);animation:fade 1s 1.5s both}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0;transform:translateY(.6em)}to{opacity:1;transform:none}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.stage.shake canvas{animation:shake .12s infinite}
@keyframes shake{0%{transform:scale(1.04) translate(3px,-2px)}50%{transform:scale(1.04) translate(-3px,2px)}100%{transform:scale(1.04) translate(2px,3px)}}
.stage:fullscreen .tag{display:none}

/* ---------- phone panel ---------- */
.phone{flex:0 0 auto;background:#fff;border-top:1px solid #dfe5ee;padding:10px 16px 14px;display:flex;flex-direction:column;gap:8px;min-height:176px}
.phone h2{font-size:12px;font-weight:700;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.phone h2 span{font-weight:500}
.pp{display:none;flex-direction:column;gap:8px;flex:1}
body[data-phase="1"] .p1,body[data-phase="2"] .p2,body[data-phase="3"] .p3{display:flex}
.emos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.emos button{font-size:26px;padding:10px 0;border-radius:14px;background:#eef1f6}
.cans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cans button{font-size:12px;font-weight:700;padding:11px 4px;border-radius:14px;background:var(--ink);color:#fff;line-height:1.25}
.votes{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.votes button{position:relative;border-radius:18px;color:#fff;font-weight:900;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:108px;overflow:hidden}
.votes button big{font-size:34px;line-height:1}
.votes button small{font-family:var(--font-latin);font-size:12px;font-weight:700;opacity:.9;font-variant-numeric:tabular-nums}
.votes .va{background:linear-gradient(135deg,var(--coral),var(--amber))}
.votes .vb{background:linear-gradient(135deg,var(--aqua),var(--indigo) 60%,var(--violet))}
.phone button:active{transform:scale(.94)}
.plus{position:absolute;left:var(--x);top:var(--y);font-family:var(--font-latin);font-weight:800;font-size:18px;pointer-events:none;animation:plus .6s ease-out forwards}
@keyframes plus{to{transform:translateY(-46px);opacity:0}}
.p3{align-items:center;justify-content:center;text-align:center;gap:6px}
.p3 strong{font-size:20px;font-weight:900}
.p3 p{font-size:13px;color:var(--ink-soft)}
.p3 button{margin-top:6px;font-size:13px;font-weight:700;padding:9px 18px;border-radius:99px;background:var(--ink);color:#fff}

@media (min-width:900px){
  .wrap{flex-direction:row}
  .phone{width:340px;border-top:0;border-left:1px solid #dfe5ee;padding:20px;justify-content:center}
  .pp{flex:0 0 auto}
  .votes button{min-height:180px}
}
@media (prefers-reduced-motion:reduce){
  .stage.shake canvas{animation:none}
  .logo .ttl span{animation-duration:.01s}
}
</style>
</head>
<body data-phase="1">
<div class="app">
  <header class="bar">
    <div class="steps" aria-label="流程階段">
      <span class="step"><b>1</b>暖場掃碼</span>
      <span class="step"><b>2</b>二選一集氣</span>
      <span class="step"><b>3</b>滿格啟動</span>
    </div>
    <div class="ctrl">
      <button id="btnNext" type="button">下一段</button>
      <button id="btnReplay" type="button">重播</button>
      <button id="btnSpeed" type="button" aria-pressed="false">正式 90 秒</button>
      <button id="btnCold" type="button" aria-pressed="false">模擬冷場</button>
      <button id="btnFull" type="button">大螢幕全螢幕</button>
    </div>
  </header>
  <div class="prog"><i id="prog"></i></div>

  <main class="wrap">
    <section class="stage" id="stage" aria-label="大螢幕畫面">
      <canvas id="bg"></canvas>
      <div class="halftone"></div>
      <div class="float" id="float"></div>

      <div class="scene s1">
        <div class="qr"><svg id="qr" viewBox="0 0 21 21" shape-rendering="crispEdges" role="img" aria-label="示意 QR Code"></svg><span>示意 QR</span></div>
        <div class="join">
          <div class="eyebrow">折射未來 由你定義</div>
          <h1>掃碼加入<br>開幕啟動</h1>
          <div class="count"><i class="live"></i>已連線 <strong id="conn">0</strong> 人</div>
        </div>
      </div>

      <div class="scene s2">
        <div class="q">你在職場最看重什麼？</div>
        <div class="ring">
          <svg viewBox="0 0 100 100">
            <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset=".35" stop-color="#ffb84d"/><stop offset=".7" stop-color="#5cc8f0"/><stop offset="1" stop-color="#5b7be8"/></linearGradient></defs>
            <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="8"/>
            <circle id="arc" cx="50" cy="50" r="45" fill="none" stroke="url(#rg)" stroke-width="8" stroke-linecap="round" stroke-dasharray="282.74" stroke-dashoffset="282.74"/>
          </svg>
          <div class="in"><small>總啟動能量</small><strong><span id="pct">0</span>%</strong><em id="boost">保底加速中</em></div>
        </div>
        <div class="tug">
          <div class="lab"><span>💰 高薪福利派<b id="pa">50%</b></span><span><b id="pb">50%</b>成長舞台派 🚀</span></div>
          <div class="track"><i class="a" id="ta"></i><i class="b"></i></div>
        </div>
      </div>

      <div class="scene s3">
        <div class="cd" id="cd">3</div>
        <div class="logo">
          <div class="yr">2027</div>
          <div class="ttl" id="ttl"></div>
          <div class="en">NCCU CAREER MONTH</div>
          <div class="slo">折射未來　由你定義</div>
        </div>
      </div>

      <div class="flash" id="flash"></div>
      <div class="tag">DEMO ・ 觀眾為模擬</div>
      <div class="host" id="host"></div>
    </section>

    <aside class="phone" aria-label="觀眾手機端">
      <h2>觀眾手機端 <span id="hint">按下去，上面的大螢幕會有反應</span></h2>
      <div class="pp p1">
        <div class="emos">
          <button type="button" data-e="🔥" aria-label="火焰">🔥</button>
          <button type="button" data-e="🚀" aria-label="火箭">🚀</button>
          <button type="button" data-e="❤️" aria-label="愛心">❤️</button>
          <button type="button" data-e="👏" aria-label="鼓掌">👏</button>
        </div>
        <div class="cans">
          <button type="button" data-d="政大讚啦🔥">政大讚啦🔥</button>
          <button type="button" data-d="好人才看過來💼">好人才<br>看過來💼</button>
          <button type="button" data-d="啟動未來🚀">啟動未來🚀</button>
        </div>
      </div>
      <div class="pp p2">
        <div class="votes">
          <button type="button" class="va" data-v="a"><big>💰</big>高薪福利派<small>我按了 <span id="ma">0</span> 下</small></button>
          <button type="button" class="vb" data-v="b"><big>🚀</big>成長舞台派<small>我按了 <span id="mb">0</span> 下</small></button>
        </div>
      </div>
      <div class="pp p3">
        <strong>🎉 啟動成功！</strong>
        <p>祝大家收穫滿滿<br>2027 政大徵才月 ・ 折射未來 由你定義</p>
        <button type="button" id="btnReplay2">再看一次</button>
      </div>
    </aside>
  </main>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var stage=$('#stage'),cv=$('#bg'),ctx=cv.getContext('2d'),floatEl=$('#float');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
var W=1,H=1,DPR=1;
function resize(){var r=stage.getBoundingClientRect();DPR=Math.min(window.devicePixelRatio||1,2);W=Math.max(1,r.width);H=Math.max(1,r.height);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else addEventListener('resize',resize);
resize();

/* seeded random so the artwork is the same every load */
var seed=20270301;
function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function rgba(hex,a){var n=parseInt(hex.slice(1),16);return'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}
var PAL=['#ff7a59','#ffb84d','#ffe58a','#8fe3d0','#5cc8f0','#5b7be8','#b58cf0','#ff9ec4'];

/* ---------- prism artwork ---------- */
var SPEC=[[240,78,58],[255,138,61],[255,214,92],[255,246,205],[150,232,214],[92,205,242],[74,111,224],[100,84,220],[176,124,240],[255,158,200]];
function spec(t,mw,a){t=((t%1)+1)%1*SPEC.length;var i=t|0,f=t-i,c1=SPEC[i%SPEC.length],c2=SPEC[(i+1)%SPEC.length];mw=mw||0;
  var r=c1[0]+(c2[0]-c1[0])*f,g=c1[1]+(c2[1]-c1[1])*f,b=c1[2]+(c2[2]-c1[2])*f;
  r+=(255-r)*mw;g+=(255-g)*mw;b+=(255-b)*mw;return'rgba('+(r|0)+','+(g|0)+','+(b|0)+','+(a==null?1:a)+')'}
var i,x,y;
/* backdrop: coarse crystal mesh */
var GX=4,GY=3,mesh=[],mtris=[];
for(y=0;y<=GY;y++)for(x=0;x<=GX;x++){var ex=x===0||x===GX,ey=y===0||y===GY;
  mesh.push({x:x===0?-.06:x===GX?1.06:x/GX+(rnd()-.5)*.2,y:y===0?-.06:y===GY?1.06:y/GY+(rnd()-.5)*.26,s:.08+rnd()*.12,p:rnd()*6,e:ex||ey})}
for(y=0;y<GY;y++)for(x=0;x<GX;x++){var a0=y*(GX+1)+x,b0=a0+1,c0=a0+GX+1,d0=c0+1,fl=rnd()>.5;
  var t1=fl?[a0,b0,c0]:[a0,b0,d0],t2=fl?[b0,d0,c0]:[a0,d0,c0];
  mtris.push({i:t1,ph:rnd(),ang:rnd()*6.28,sp:.5+rnd()},{i:t2,ph:rnd(),ang:rnd()*6.28,sp:.5+rnd()})}
/* folded prism ribbons */
function mkRib(pts,ph0){var o={p:[],f:[]};pts.forEach(function(q){o.p.push({x:q[0],y:q[1],s:.12+rnd()*.14,p:rnd()*6})});
  for(var k=0;k<pts.length-2;k++)o.f.push({ph:ph0+k*.17+rnd()*.08,ang:rnd()*6.28,sp:.6+rnd()*.8,gl:rnd()});return o}
var ribs=[
  mkRib([[-.08,.0],[.1,.52],[.2,.1],[.33,.68],[.45,.14],[.54,.82],[.64,-.06],[.73,1.0],[.83,.26],[1.08,.62],[.93,1.08]],.02),
  mkRib([[.68,-.06],[.87,.2],[1.06,-.04],[1.08,.34]],.55),
  mkRib([[-.06,.72],[.1,.86],[-.04,1.06],[.24,1.06]],.3)
];
var blur=document.createElement('canvas');blur.width=56;blur.height=40;var bctx=blur.getContext('2d');
var blocks=[];for(i=0;i<12;i++)blocks.push({x:rnd(),y:rnd(),w:.14+rnd()*.3,h:.06+rnd()*.16,c:rnd(),s:.03+rnd()*.05,p:rnd()*6});
var nodes=[];for(i=0;i<8;i++)nodes.push({x:rnd(),y:rnd(),s:.08+rnd()*.1,p:rnd()*6,m:i%3===0});
var parts=[],waves=[];
var spin=0,T=0,energy=0,conv=0,flow=0;

function gradTri(P,ph,ang,mw,al){
  var mx=(P[0][0]+P[1][0]+P[2][0])/3,my=(P[0][1]+P[1][1]+P[2][1])/3,R=0;
  for(var k=0;k<3;k++)R=Math.max(R,Math.hypot(P[k][0]-mx,P[k][1]-my));
  var dx=Math.cos(ang)*R,dy=Math.sin(ang)*R,g=ctx.createLinearGradient(mx-dx,my-dy,mx+dx,my+dy);
  g.addColorStop(0,spec(ph,mw,al));g.addColorStop(.5,spec(ph+.16,mw,al));g.addColorStop(1,spec(ph+.34,mw,al));
  return{g:g,mx:mx,my:my,dx:dx,dy:dy}}
function path(P,ox){ctx.beginPath();ctx.moveTo(P[0][0]+ox,P[0][1]);ctx.lineTo(P[1][0]+ox,P[1][1]);ctx.lineTo(P[2][0]+ox,P[2][1]);ctx.closePath()}

function draw(dt){
  T+=dt;var mot=reduce?.35:1;
  spin+=dt*(.03+energy*.22+conv*3.2)*mot;
  flow+=dt*(.025+energy*.09+conv*.6)*mot;
  var D=Math.hypot(W,H),cx=W/2,cy=H/2;
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#fbfcff';ctx.fillRect(0,0,W,H);

  /* soft colour blocks, drawn tiny and scaled up for a cheap blur */
  bctx.fillStyle='#f6f8fd';bctx.fillRect(0,0,56,40);
  for(i=0;i<blocks.length;i++){var bl=blocks[i];bctx.fillStyle=spec(bl.c+flow*.3,.35,.75);
    bctx.fillRect((bl.x+Math.sin(T*bl.s+bl.p)*.12-bl.w/2)*56,(bl.y-bl.h/2)*40,bl.w*56,bl.h*40)}
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';ctx.drawImage(blur,0,0,W,H);

  /* backdrop facets */
  var mp=[];for(i=0;i<mesh.length;i++){var m=mesh[i],am=m.e?0:.035;mp.push([(m.x+Math.sin(T*m.s+m.p)*am)*W,(m.y+Math.cos(T*m.s*1.3+m.p)*am)*H])}
  for(i=0;i<mtris.length;i++){var mt=mtris[i],P=[mp[mt.i[0]],mp[mt.i[1]],mp[mt.i[2]]];
    var gt=gradTri(P,mt.ph+flow*mt.sp,mt.ang,.5,.62);path(P,0);ctx.fillStyle=gt.g;ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1;ctx.stroke()}

  /* ribbon geometry */
  var cs=Math.cos(conv*1.7),sn=Math.sin(conv*1.7),sc=1-conv*.82,RP=[];
  for(var r=0;r<ribs.length;r++){var arr=[];for(i=0;i<ribs[r].p.length;i++){var q=ribs[r].p[i];
      var px=(q.x+Math.sin(T*q.s+q.p)*.022)*W-cx,py=(q.y+Math.cos(T*q.s*1.2+q.p)*.03)*H-cy;
      arr.push([cx+(px*cs-py*sn)*sc,cy+(px*sn+py*cs)*sc])}RP.push(arr)}

  /* white beam in, spectrum out */
  var O=RP[0][3],base=-.28+Math.sin(T*.21)*.12,span=.5+energy*.25,L=D*1.1,N=9;
  for(i=0;i<N;i++){var a1=base+span*(i/N-.5),a2=base+span*((i+1)/N-.5);
    var fg=ctx.createLinearGradient(O[0],O[1],O[0]+Math.cos(base)*L,O[1]+Math.sin(base)*L);
    fg.addColorStop(0,spec(i/N*.92,0,.5+.4*energy));fg.addColorStop(.6,spec(i/N*.92,.2,.22+.3*energy));fg.addColorStop(1,spec(i/N*.92,.4,0));
    ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(O[0],O[1]);ctx.lineTo(O[0]+Math.cos(a1)*L,O[1]+Math.sin(a1)*L);ctx.lineTo(O[0]+Math.cos(a2)*L,O[1]+Math.sin(a2)*L);ctx.closePath();ctx.fill()}
  var bx=-W*.05,by=O[1]+H*.22;
  ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=Math.max(5,D*.009);ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(O[0],O[1]);ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1.5,D*.0025);ctx.stroke();

  /* ribbons: colour fringes, saturated fill, travelling glint */
  var fr=D*(.0035+.006*energy+.01*conv);
  for(r=0;r<ribs.length;r++){var rp=RP[r];
    for(i=0;i<ribs[r].f.length;i++){var f=ribs[r].f[i],Q=[rp[i],rp[i+1],rp[i+2]];
      path(Q,-fr);ctx.fillStyle='rgba(255,70,110,.55)';ctx.fill();
      path(Q,fr);ctx.fillStyle='rgba(60,150,255,.55)';ctx.fill();
      var gq=gradTri(Q,f.ph+flow*f.sp,f.ang+spin*.15,0,.96);path(Q,0);ctx.fillStyle=gq.g;ctx.fill();
      var h=((T*.11*f.sp+f.gl)%1)*1.5-.25,gg=ctx.createLinearGradient(gq.mx-gq.dy,gq.my+gq.dx,gq.mx+gq.dy,gq.my-gq.dx);
      var h0=Math.max(0,Math.min(1,h-.14)),h1=Math.max(0,Math.min(1,h)),h2=Math.max(0,Math.min(1,h+.14));
      gg.addColorStop(h0,'rgba(255,255,255,0)');gg.addColorStop(h1,'rgba(255,255,255,'+(h>0&&h<1?.6:0)+')');gg.addColorStop(h2,'rgba(255,255,255,0)');
      ctx.fillStyle=gg;ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1;ctx.stroke();
    }}

  /* refracted light lines and molecule clusters */
  var np=[];for(i=0;i<nodes.length;i++){var n=nodes[i];np.push([(n.x+Math.sin(T*n.s+n.p)*.06)*W,(n.y+Math.cos(T*n.s*1.4+n.p)*.06)*H])}
  ctx.globalAlpha=.85;ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.beginPath();
  for(i=0;i<np.length;i++){var a=np[i],b1=np[(i+1)%np.length],b2=np[(i+3)%np.length];ctx.moveTo(a[0],a[1]);ctx.lineTo(b1[0],b1[1]);ctx.moveTo(a[0],a[1]);ctx.lineTo(b2[0],b2[1])}
  ctx.stroke();
  var mr=Math.max(5,D*.012);
  for(i=0;i<np.length;i++){if(!nodes[i].m)continue;var q2=np[i],cols=['#35c2b0','#6a5be0','#4f86e8'];
    ctx.globalAlpha=.82;
    for(var k=0;k<3;k++){var aa=T*.3+i+k*2.1,rr=mr*(1-k*.22);ctx.fillStyle=cols[(i+k)%3];ctx.beginPath();ctx.arc(q2[0]+Math.cos(aa)*mr*1.1*k*.8,q2[1]+Math.sin(aa)*mr*1.1*k*.8,rr,0,6.283);ctx.fill()}
  }

  /* burst */
  for(i=waves.length-1;i>=0;i--){var w=waves[i];w.r+=dt*D*.9;w.a-=dt*.9;if(w.a<=0){waves.splice(i,1);continue}if(w.r<=0)continue;
    ctx.globalAlpha=w.a;ctx.strokeStyle='#fff';ctx.lineWidth=D*.012*w.a;ctx.beginPath();ctx.arc(cx,cy,w.r,0,6.283);ctx.stroke()}
  for(i=parts.length-1;i>=0;i--){var pt=parts[i];pt.life-=dt;if(pt.life<=0){parts.splice(i,1);continue}
    pt.vx*=1-dt*.9;pt.vy=pt.vy*(1-dt*.9)+dt*H*.12;pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.rot+=pt.vr*dt;
    ctx.save();ctx.translate(pt.x,pt.y);ctx.rotate(pt.rot);ctx.globalAlpha=Math.min(1,pt.life*1.2)*.95;
    var pg=ctx.createLinearGradient(-pt.s,0,pt.s,0);pg.addColorStop(0,pt.c1);pg.addColorStop(1,pt.c2);ctx.fillStyle=pg;
    ctx.beginPath();ctx.moveTo(-pt.s,pt.s*.5);ctx.lineTo(pt.s,pt.s*.2);ctx.lineTo(-pt.s*.1,-pt.s*.9);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
  ctx.globalAlpha=1;
}
function burst(){
  var D=Math.hypot(W,H),n=reduce?40:150;
  for(var i=0;i<n;i++){var a=Math.random()*6.283,v=D*(.25+Math.random()*.85);
    parts.push({x:W/2,y:H/2,vx:Math.cos(a)*v,vy:Math.sin(a)*v,rot:Math.random()*6,vr:(Math.random()-.5)*8,s:D*(.008+Math.random()*.028),c1:spec(i/n*3),c2:spec(i/n*3+.2),life:1.8+Math.random()*2.2})}
  waves.push({r:0,a:1},{r:-D*.12,a:.8});
}

/* ---------- QR placeholder ---------- */
(function(){var q=$('#qr'),h='',N=21,s=7;
  function r(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff}
  function finder(x,y){h+='<rect x="'+x+'" y="'+y+'" width="7" height="7" fill="#1c2740"/><rect x="'+(x+1)+'" y="'+(y+1)+'" width="5" height="5" fill="#fff"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3" fill="#1c2740"/>'}
  for(var y=0;y<N;y++)for(var x=0;x<N;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(r()>.52)h+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="#1c2740"/>'}
  finder(0,0);finder(14,0);finder(0,14);q.innerHTML=h})();

/* title characters */
(function(){var t='政大徵才月',h='';for(var i=0;i<t.length;i++)h+='<span style="--i:'+i+'">'+t[i]+'</span>';$('#ttl').innerHTML=h})();

/* ---------- floating reactions ---------- */
function emoji(e,x){
  if(floatEl.childElementCount>70)return;
  var el=document.createElement('span');el.className='em';el.textContent=e;
  el.style.setProperty('--x',(x==null?4+Math.random()*90:x)+'%');
  el.style.setProperty('--dx',(Math.random()*16-8)+'cqw');
  el.style.setProperty('--d',(2.6+Math.random()*1.8)+'s');
  el.addEventListener('animationend',function(){el.remove()});floatEl.appendChild(el);
}
function danmaku(t,me){
  if(floatEl.childElementCount>70)return;
  var el=document.createElement('span');el.className='dm'+(me?' me':'');el.textContent=t;
  el.style.setProperty('--y',(9+Math.random()*16)+'%');
  el.style.setProperty('--d',(me?5:6+Math.random()*4)+'s');
  el.addEventListener('animationend',function(){el.remove()});floatEl.appendChild(el);
}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}}
var EM=['🔥','🚀','❤️','👏'],DM=['政大讚啦🔥','好人才看過來💼','啟動未來🚀'];

/* ---------- show flow ---------- */
var DUR={fast:[10,12,12],full:[30,25,20]},mode='fast',cold=false;
var phase=0,pt=0,va=0,vb=0,ma=0,mb=0,fired=false,cdShown=0,emAcc=0,dmAcc=0;
var HOST=['「請大家拿出手機掃描螢幕，先按個表情符號幫現場暖暖身！」','「選出你在職場最看重的選項，一起瘋狂點擊把能量灌滿！」','「3、2、1！能量滿格！政大徵才月正式啟動！」'];
var GOAL=6000,PEOPLE=862;
var elConn=$('#conn'),elPct=$('#pct'),elArc=$('#arc'),elBoost=$('#boost'),elPa=$('#pa'),elPb=$('#pb'),elTa=$('#ta'),elProg=$('#prog'),elCd=$('#cd'),elHost=$('#host');

function setPhase(p){
  phase=p;pt=0;document.body.dataset.phase=p+1;
  elHost.innerHTML='<b>主持人</b>'+HOST[p];
  if(p===0){va=vb=ma=mb=0;energy=0;conv=0;fired=false;cdShown=0;parts.length=0;waves.length=0;document.body.classList.remove('lit');stage.classList.remove('shake');$('#ma').textContent='0';$('#mb').textContent='0';floatEl.innerHTML=''}
  if(p===2){energy=1;fired=false;cdShown=0}
}
function fire(){
  fired=true;stage.classList.remove('shake');document.body.classList.add('lit');
  var fl=$('#flash');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');
  burst();buzz([60,40,120]);
}
function tick(dt){
  var D=DUR[mode][phase];pt+=dt;
  if(phase===0){
    var k=Math.min(1,pt/(D*.85)),e=1-Math.pow(1-k,3);
    elConn.textContent=Math.round(PEOPLE*e*(cold?.35:1));
    energy=.05*e;
    emAcc+=dt*(2+9*e)*(cold?.25:1);while(emAcc>1){emAcc--;emoji(EM[Math.random()*4|0])}
    dmAcc+=dt*(cold?.25:1);if(dmAcc>.9){dmAcc=0;danmaku(DM[Math.random()*3|0])}
    if(pt>=D)setPhase(1);
  }else if(phase===1){
    var rate=(GOAL*.8/D)*(cold?.25:1),bias=.5+Math.sin(pt*1.3)*.09+Math.sin(pt*.37)*.05;
    var add=rate*dt*(.6+Math.random()*.8);va+=add*bias;vb+=add*(1-bias);
    var tap=(va+vb)/GOAL*100,floor=100*Math.pow(Math.min(1,pt/D),3),en=Math.min(100,Math.max(tap,floor));
    elBoost.classList.toggle('on',floor>tap&&en>3);
    energy=en/100;
    elPct.textContent=Math.floor(en);elArc.setAttribute('stroke-dashoffset',(282.74*(1-energy)).toFixed(1));
    var pa=va/(va+vb||1)*100;elTa.style.width=pa.toFixed(1)+'%';elPa.textContent=Math.round(pa)+'%';elPb.textContent=(100-Math.round(pa))+'%';
    emAcc+=dt*3;while(emAcc>1){emAcc--;if(Math.random()<bias)emoji('💰',4+Math.random()*38);else emoji('🚀',58+Math.random()*38)}
    if(en>=100)setPhase(2);
  }else{
    if(!fired){
      var c=Math.min(1,pt/1.8);conv=c*c*c;
      if(!reduce)stage.classList.add('shake');
      var n=3-Math.min(2,Math.floor(pt/.6));
      if(n!==cdShown){cdShown=n;elCd.textContent=n;elCd.classList.remove('pop');void elCd.offsetWidth;elCd.classList.add('pop');buzz(30)}
      if(pt>=1.8)fire();
    }else{
      var r=Math.max(0,1-(pt-1.8)/1.4);conv=r*r;
      if(pt<9){emAcc+=dt*4;while(emAcc>1){emAcc--;emoji(['🎉','✨','🔥','🚀'][Math.random()*4|0])}}
    }
  }
  elProg.style.width=Math.min(100,pt/D*100)+'%';
}

var last=performance.now();
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;try{tick(dt);draw(dt)}catch(e){}requestAnimationFrame(loop)}
setPhase(0);requestAnimationFrame(loop);

/* ---------- controls ---------- */
function press(el,fn){el.addEventListener('pointerdown',function(ev){ev.preventDefault();fn(ev)});el.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();fn(ev)}})}
document.querySelectorAll('[data-e]').forEach(function(b){press(b,function(){emoji(b.dataset.e);emoji(b.dataset.e);buzz(15)})});
document.querySelectorAll('[data-d]').forEach(function(b){press(b,function(){danmaku(b.dataset.d,true);buzz(15)})});
document.querySelectorAll('[data-v]').forEach(function(b){press(b,function(ev){
  if(phase!==1)return;
  var a=b.dataset.v==='a';if(a){va++;ma++;$('#ma').textContent=ma}else{vb++;mb++;$('#mb').textContent=mb}
  emoji(a?'💰':'🚀',a?6+Math.random()*36:58+Math.random()*36);buzz(12);
  var r=b.getBoundingClientRect(),p=document.createElement('span');p.className='plus';p.textContent='+1';
  p.style.setProperty('--x',((ev.clientX||r.left+r.width/2)-r.left-8)+'px');p.style.setProperty('--y',((ev.clientY||r.top+r.height/2)-r.top-24)+'px');
  p.addEventListener('animationend',function(){p.remove()});b.appendChild(p);
})});
$('#btnNext').addEventListener('click',function(){if(phase<2)setPhase(phase+1);else setPhase(0)});
$('#btnReplay').addEventListener('click',function(){setPhase(0)});
$('#btnReplay2').addEventListener('click',function(){setPhase(0)});
$('#btnSpeed').addEventListener('click',function(){mode=mode==='fast'?'full':'fast';this.setAttribute('aria-pressed',mode==='full')});
$('#btnCold').addEventListener('click',function(){cold=!cold;this.setAttribute('aria-pressed',cold)});
$('#btnFull').addEventListener('click',function(){
  try{var f=stage.requestFullscreen||stage.webkitRequestFullscreen;if(!f)return;var r=f.call(stage);if(r&&r.catch)r.catch(function(){})}catch(e){}
});
})();
</script>
